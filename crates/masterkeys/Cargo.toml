[package]
name = "masterkeys"
version = "0.1.0"
description = "MasterKeys: control panel for the SteelSeries Apex 3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
masterkeys-core = { path = "../masterkeys-core" }
steelseries-gg = { path = "../steelseries-gg" }
slint = "1.18.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "proxy", "service"] }
serde_json = "1"
futures-util = "0.3"
sha2 = "0.10"
semver = "1"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(not(windows))'.dependencies]
ureq = "3"

[target.'cfg(windows)'.dependencies]
# Windows' own TLS (SChannel): no C toolchain needed, unlike ring.
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
masterkeysd = { path = "../masterkeysd" }
tray-icon = "0.21"
tracing-subscriber = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
self-replace = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same features as Slint's own ksni (its system-tray support), so the two unify.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[dev-dependencies]
masterkeysd = { path = "../masterkeysd" }
tempfile = "3"
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "proxy", "service", "p2p"] }
