[package]
name = "steelseries-gg"
version = "0.1.17"
description = "SteelSeries Apex 3 device library for MasterKeys (vendored fork of steelseriesgg-rs)"
repository = "https://github.com/Ven0m0/steelseriesgg-rs"
readme = "UPSTREAM.md"
license = "MIT"
edition.workspace = true
rust-version.workspace = true
publish = false
categories = ["hardware-support", "games"]

[lib]
name = "steelseries_gg"
path = "src/lib.rs"

[features]
default = []
# Linux-only evdev key remapper (grab + uinput)
remap = ["dep:evdev", "rustix/event"]

[dependencies]
# HTTP server for GameSense API
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json"] }

# Configuration
directories = "6.0.0"
# hidapi is configured per-platform — see [target.*] sections below

libc = "0.2.191" # For root permission checks (geteuid)
parking_lot = "0.13.0"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Error handling
thiserror = "2.0.21"
# Async runtime - only include needed features to reduce binary size
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "fs", "sync"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", default-features = false, features = ["cors"] }

# Logging
tracing = "0.1.44"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["linux-native-basic-udev"] }
# evdev grab + uinput for the optional `remap` feature
evdev = { version = "0.13.2", optional = true }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["windows-native"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
collapsible_if = "allow"
