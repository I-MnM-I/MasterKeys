[package]
name = "masterkeys-core"
version = "0.1.0"
description = "Shared types and D-Bus interface for MasterKeys"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
steelseries-gg = { path = "../steelseries-gg" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "proxy"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
