[package]
name = "masterkeysd"
version = "0.2.0"
description = "MasterKeys daemon: owns the SteelSeries Apex 3 and serves lighting control on D-Bus"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
masterkeys-core = { path = "../masterkeys-core" }
steelseries-gg = { path = "../steelseries-gg" }
serde_json = "1"
futures-util = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "service", "proxy", "p2p"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13", features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "service", "proxy", "p2p"] }
futures-util = "0.3"
tempfile = "3"
